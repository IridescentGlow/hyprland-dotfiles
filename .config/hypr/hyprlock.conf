general { hide_cursor = true }

background {
  monitor =
  path = /home/Luminara/Pictures/wallpapers/wallpapers/phone-lines.jpg
  blur_passes = 0
}

# Vertical clock: hours stacked over minutes, no colon
label {
  monitor =
  text = cmd[update:1000] date +%H
  color = rgba(255, 255, 255, 1.0)
  font_size = 110
  position = 0, 190
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:1000] date +%M
  color = rgba(255, 255, 255, 1.0)
  font_size = 110
  position = 0, 60
  halign = center
  valign = center
}

# Hidden until a key is pressed; fades out again 1.5s after the buffer is empty
input-field {
  monitor =
  size = 300, 50
  outline_thickness = 1
  rounding = -1
  outer_color = rgba(255, 255, 255, 0.18)
  inner_color = rgba(0, 0, 0, 0.45)
  font_color = rgba(255, 255, 255, 1.0)
  check_color = rgba(255, 255, 255, 0.5)
  fail_color = rgba(255, 90, 90, 0.8)
  fade_on_empty = true
  fade_timeout = 1500
  placeholder_text =
  dots_center = true
  position = 0, -90
  halign = center
  valign = center
}
